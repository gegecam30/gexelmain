<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursos — Gexel</title>

  <link rel="icon" href="icon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css">

  <style>
    /* ── Recursos ── */
    .main-wrapper.resources-section {
      position: relative;
      z-index: 1;
    }
    .section-subtitle {
      color: #92dce8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .resources-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 700px)  { .resources-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1020px) { .resources-grid { grid-template-columns: repeat(3, 1fr); } }

    .res-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(0,229,255,0.2);
      background: rgba(8, 18, 23, 0.72);
      backdrop-filter: blur(4px);
      color: inherit;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .res-card:hover, .res-card:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(0,229,255,0.8);
      box-shadow: 0 0 0 1px rgba(0,229,255,0.5), 0 0 30px rgba(0,229,255,0.25), 0 20px 40px rgba(0,0,0,0.6);
      outline: none;
    }
    .res-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .res-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(0,229,255,0.35);
      background: #050a0d;
      object-fit: cover;
    }
    .res-name {
      font-family: 'Silkscreen', cursive;
      font-size: 22px;
      color: #ffffff;
      overflow-wrap: anywhere;
    }
    .res-desc { font-size: 14px; color: #92dce8; line-height: 1.6; flex: 1; }
    .res-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .res-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.4);
      color: #00e5ff;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .res-cta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0,229,255,0.5);
    }
    .res-card:hover .res-cta { color: #ffffff; }
    .res-card.is-soon {
      border: 2px dashed rgba(0,229,255,0.25);
      background: rgba(8, 18, 23, 0.35);
      align-items: center;
      justify-content: center;
      min-height: 200px;
      text-align: center;
      font-family: 'Silkscreen', cursive;
      font-size: 18px;
      color: rgba(0,229,255,0.5);
    }
    .res-card.is-soon:hover { transform: none; box-shadow: none; border-color: rgba(0,229,255,0.25); }

    .hero.hero-compact { padding: 56px 24px 40px; }
    .hero.hero-compact .hero-byline { margin-bottom: 0; }
    .section-subtitle { margin-bottom: 40px; }
    .res-icon { object-fit: cover; }
    @media (max-width: 640px) {
      .main-wrapper { padding: 0 20px 80px; }
      .hero.hero-compact { padding: 40px 20px 32px; }
    }
  </style>
</head>
<body>

  <div class="bg-silhouette" aria-hidden="true"></div>
  <div id="particles"></div>

  <audio id="bg-music" loop preload="auto"><source src="music/ambient.mp3" type="audio/mpeg"></audio>

  <div class="music-wrapper">
    <span class="music-credit">GEXEL // AUDIO 8-BIT</span>
    <button id="music-toggle" class="music-btn" title="Activar/Silenciar Música">
      <span id="music-icon">🔇</span>
    </button>
  </div>

  <nav class="nav-hud">
    <div class="nav-container">
      <a href="index.html" class="brand-group">
        <div class="brand-cube"></div>
        <div class="brand-title">GEXEL<span>.</span></div>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" aria-current="page">Recursos</a></li>
        <li><a href="sobre-mi.html">Sobre mí</a></li>
        <li><a href="plugins.html">Plugins</a></li>
        <li><a href="https://pexread.gexel.fun" target="_blank" rel="noopener">pexread.gexel.fun</a></li>
      </ul>

      <div class="nav-badge-status">
        <span class="status-dot-blink"></span>
        <span>STUDIO ONLINE</span>
      </div>
    </div>
  </nav>

  <header class="hero hero-compact">
    <p class="hero-eyebrow">GEXEL // RECURSOS</p>
    <h1 class="hero-title">Recursos</h1>
    <p class="hero-byline">Programas que uso y recomiendo en mis videos</p>
  </header>

  <div class="warden-divider"><div class="divider-eye"></div></div>

  <main class="main-wrapper resources-section">
    <p class="section-eyebrow">Catálogo</p>
    <h2 class="section-headline">Software recomendado</h2>
    <div class="resources-grid" id="resources-grid"></div>
    <noscript><p class="section-subtitle">Activa JavaScript para ver los recursos. Mientras tanto: <a href="https://github.com/maxrave-dev/SimpMusic/releases/latest" style="color:#00e5ff">SimpMusic</a>.</p></noscript>
  </main>

  <footer>
    &copy; 2026 Gexel Technologies &mdash; Creado por <a href="https://github.com/gegecam30" target="_blank" rel="noopener">gegecam30</a> &amp; <a href="https://github.com/TUXERO1986" target="_blank" rel="noopener">TUXERO1986</a> &mdash; All Rights Reserved
  </footer>

  <script src="site.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────
    // RECURSOS: para agregar un programa nuevo, copia un bloque { ... }
    // dentro de este array y cambia sus datos. Nada más.
    //   name        → nombre que se muestra
    //   description → descripción corta en español
    //   url         → enlace al que va toda la tarjeta (se abre en pestaña nueva)
    //   icon        → URL o ruta (p. ej. 'img/mi-icono.png', guárdalo en img/); si falla, se usa la inicial
    //   tags        → etiquetas pequeñas, ej. ['Android', 'Gratis']
    //   cta         → (opcional) texto del botón, por defecto 'Descargar ↗'
    // La tarjeta "Próximamente…" se agrega sola al final.
    // ─────────────────────────────────────────────────────────────
    const RESOURCES = [
      {
        name: 'SimpMusic',
        description: 'Cliente gratuito y de código abierto para YouTube Music en Android y escritorio: sin anuncios y con reproducción en segundo plano.',
        url: 'https://github.com/maxrave-dev/SimpMusic/releases/latest',
        icon: 'img/simpmusic.png',
        tags: ['Android', 'Open Source', 'Gratis'],
      },
      // { name: '', description: '', url: '', icon: '', tags: [] },
    ];

    (function renderResources() {
      const grid = document.getElementById('resources-grid');
      if (!grid) return;

      RESOURCES.forEach((r) => {
        const a = document.createElement('a');
        a.className = 'res-card';
        a.href = r.url;
        a.target = '_blank';
        a.rel = 'noopener';

        const head = document.createElement('div');
        head.className = 'res-head';

        const img = document.createElement('img');
        img.className = 'res-icon';
        img.alt = '';
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => {
          const ph = document.createElement('div');
          ph.className = 'res-icon';
          ph.style.cssText = 'display:flex;align-items:center;justify-content:center;font-family:Silkscreen,cursive;font-size:22px;color:#00e5ff';
          ph.textContent = (r.name || '?').charAt(0).toUpperCase();
          img.replaceWith(ph);
        };
        img.src = r.icon || '';

        const name = document.createElement('h3');
        name.className = 'res-name';
        name.textContent = r.name;
        head.append(img, name);

        const desc = document.createElement('p');
        desc.className = 'res-desc';
        desc.textContent = r.description;

        const tags = document.createElement('div');
        tags.className = 'res-tags';
        (r.tags || []).forEach((t) => {
          const span = document.createElement('span');
          span.className = 'res-tag';
          span.textContent = t;
          tags.appendChild(span);
        });

        const cta = document.createElement('span');
        cta.className = 'res-cta';
        cta.textContent = r.cta || 'Descargar ↗';

        a.append(head, desc, tags, cta);
        grid.appendChild(a);
      });

      const soon = document.createElement('div');
      soon.className = 'res-card is-soon';
      soon.textContent = 'Próximamente…';
      grid.appendChild(soon);
    })();

  </script>
</body>
</html>
