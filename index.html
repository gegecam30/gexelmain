<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gexel</title>

  <link rel="icon" href="ico.ico" type="image/x-icon">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300&family=Silkscreen&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    :root {
      --bg: #030709;
      --cyan: #00f2ff;
      --cyan-dim: rgba(0, 242, 255, 0.15);
      --cyan-glow: rgba(0, 242, 255, 0.4);
      --magenta: #ff0055;
      --dark-card: rgba(8, 16, 22, 0.75);
      --border-card: rgba(0, 242, 255, 0.18);
      --text-muted: #527883;
      --text-bright: #d9f7ff;
    }

    body {
      background-color: var(--bg);
      color: var(--text-bright);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* Ambient Background Elements */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, #010406 95%);
      pointer-events: none;
      z-index: 1;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
    }

    /* Card Container */
    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      padding: 44px 32px;
      background: var(--dark-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      text-align: center;
      box-shadow: 
        0 0 50px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(0, 242, 255, 0.05),
        inset 0 0 25px rgba(0, 242, 255, 0.03);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: rgba(0, 242, 255, 0.45);
      box-shadow: 
        0 0 60px rgba(0, 0, 0, 0.95),
        0 0 45px rgba(0, 242, 255, 0.12),
        inset 0 0 35px rgba(0, 242, 255, 0.06);
      transform: translateY(-3px);
    }

    /* Top Corner Tech Decorators */
    .card-corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--cyan);
      opacity: 0.5;
    }
    .top-left { top: 10px; left: 10px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .top-right { top: 10px; right: 10px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .bottom-left { bottom: 10px; left: 10px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .bottom-right { bottom: 10px; right: 10px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* Avatar Container with Radar Ring */
    .avatar-wrapper {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto 28px;
      cursor: pointer;
    }

    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 255, 0.4);
      animation: rotateRing 20s linear infinite;
      pointer-events: none;
    }

    .avatar-ring-pulse {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 242, 255, 0.15);
      animation: pulseGlow 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.2; }
      100% { transform: scale(1.08); opacity: 0.8; }
    }

    /* ── Glitch Avatar System ── */
    .glitch-avatar-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
      background: #000;
    }

    .avatar-main {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease;
    }

    .glitch-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image: url('anubis12.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0;
      pointer-events: none;
    }

    /* Periodic idle glitch + Intense hover/active glitch */
    .glitch-cyan {
      filter: drop-shadow(-3px 0 var(--cyan)) brightness(1.2) hue-rotate(170deg);
      mix-blend-mode: screen;
      animation: glitchAnimCyan 4.5s infinite;
    }

    .glitch-red {
      filter: drop-shadow(3px 0 var(--magenta)) brightness(1.2) hue-rotate(320deg);
      mix-blend-mode: screen;
      animation: glitchAnimRed 4.5s infinite;
    }

    .glitch-slice {
      filter: contrast(1.4) brightness(1.1);
      animation: glitchAnimSlice 4.5s infinite;
    }

    .glitch-scanlines {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 242, 255, 0.08) 0px,
        rgba(0, 242, 255, 0.08) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      mix-blend-mode: overlay;
      opacity: 0.7;
    }

    /* Ambient Idle Glitch Keyframes */
    @keyframes glitchAnimCyan {
      0%, 82%, 100% {
        opacity: 0;
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
      }
      83% {
        opacity: 0.8;
        transform: translate(-4px, 1px);
        clip-path: inset(20% 0 50% 0);
      }
      85% {
        opacity: 0.9;
        transform: translate(3px, -2px);
        clip-path: inset(65% 0 10% 0);
      }
      87% {
        opacity: 0;
        transform: translate(0, 0);
      }
      92% {
        opacity: 0.7;
        transform: translate(-3px, 2px);
        clip-path: inset(10% 0 75% 0);
      }
      94% {
        opacity: 0;
      }
    }

    @keyframes glitchAnimRed {
      0%, 82%, 100% {
        opacity: 0;
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
      }
      83% {
        opacity: 0.8;
        transform: translate(4px, -1px);
        clip-path: inset(45% 0 25% 0);
      }
      85% {
        opacity: 0.9;
        transform: translate(-3px, 2px);
        clip-path: inset(5% 0 70% 0);
      }
      87% {
        opacity: 0;
        transform: translate(0, 0);
      }
      92% {
        opacity: 0.7;
        transform: translate(3px, -1px);
        clip-path: inset(60% 0 15% 0);
      }
      94% {
        opacity: 0;
      }
    }

    @keyframes glitchAnimSlice {
      0%, 82%, 100% {
        opacity: 0;
        transform: translateX(0);
      }
      83% {
        opacity: 0.9;
        transform: translateX(-5px);
        clip-path: inset(30% 0 45% 0);
      }
      85% {
        opacity: 0.9;
        transform: translateX(5px);
        clip-path: inset(70% 0 15% 0);
      }
      86% {
        opacity: 0;
      }
    }

    /* Hover & Active Glitch (Intense) */
    .avatar-wrapper:hover .glitch-cyan,
    .avatar-wrapper.active-glitch .glitch-cyan {
      animation: glitchIntenseCyan 0.35s infinite steps(2, start);
    }

    .avatar-wrapper:hover .glitch-red,
    .avatar-wrapper.active-glitch .glitch-red {
      animation: glitchIntenseRed 0.35s infinite steps(2, start);
    }

    .avatar-wrapper:hover .glitch-slice,
    .avatar-wrapper.active-glitch .glitch-slice {
      animation: glitchIntenseSlice 0.25s infinite;
    }

    .avatar-wrapper:hover .avatar-main {
      filter: contrast(1.2) brightness(1.1);
    }

    @keyframes glitchIntenseCyan {
      0% { opacity: 0.9; transform: translate(-5px, 2px); clip-path: inset(10% 0 60% 0); }
      20% { opacity: 0.7; transform: translate(4px, -2px); clip-path: inset(50% 0 20% 0); }
      40% { opacity: 1; transform: translate(-3px, -3px); clip-path: inset(30% 0 40% 0); }
      60% { opacity: 0.8; transform: translate(5px, 1px); clip-path: inset(70% 0 5% 0); }
      80% { opacity: 0.9; transform: translate(-4px, 3px); clip-path: inset(15% 0 55% 0); }
      100% { opacity: 0.7; transform: translate(3px, -1px); clip-path: inset(40% 0 35% 0); }
    }

    @keyframes glitchIntenseRed {
      0% { opacity: 0.9; transform: translate(5px, -2px); clip-path: inset(40% 0 30% 0); }
      20% { opacity: 0.8; transform: translate(-4px, 3px); clip-path: inset(15% 0 65% 0); }
      40% { opacity: 1; transform: translate(4px, 2px); clip-path: inset(65% 0 10% 0); }
      60% { opacity: 0.7; transform: translate(-5px, -2px); clip-path: inset(25% 0 45% 0); }
      80% { opacity: 0.9; transform: translate(3px, -3px); clip-path: inset(50% 0 25% 0); }
      100% { opacity: 0.8; transform: translate(-3px, 2px); clip-path: inset(5% 0 75% 0); }
    }

    @keyframes glitchIntenseSlice {
      0% { opacity: 0.9; transform: translate(-6px, 0); clip-path: inset(20% 0 60% 0); }
      30% { opacity: 0.9; transform: translate(7px, 0); clip-path: inset(60% 0 20% 0); }
      70% { opacity: 1; transform: translate(-4px, 0); clip-path: inset(40% 0 40% 0); }
      100% { opacity: 0; transform: translate(0, 0); }
    }

    /* Identity & Decoder */
    .alias {
      font-family: 'Silkscreen', cursive;
      font-size: 28px;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 242, 255, 0.05);
      border: 1px solid rgba(0, 242, 255, 0.2);
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .divider {
      height: 1px;
      width: 60px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin: 0 auto 22px;
      opacity: 0.4;
    }

    /* Stealth Message / Scramble */
    .scramble-box {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .scramble-text {
      font-size: 13px;
      color: var(--text-bright);
      opacity: 0.85;
      font-weight: 300;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .sub-code {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Footer minimalist tag */
    .node-id {
      margin-top: 26px;
      font-size: 10px;
      color: rgba(0, 242, 255, 0.3);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Audio synth ripple click effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 255, 0.4) 0%, transparent 70%);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Neural Starfield Canvas -->
  <canvas id="canvas-bg"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- Central Stealth Card -->
  <main class="card" id="main-card">
    <div class="card-corner top-left"></div>
    <div class="card-corner top-right"></div>
    <div class="card-corner bottom-left"></div>
    <div class="card-corner bottom-right"></div>

    <div class="avatar-wrapper" id="avatar-btn" title="[ Encrypted Node ]">
      <div class="avatar-ring-pulse"></div>
      <div class="avatar-ring"></div>
      <div class="glitch-avatar-box">
        <img src="anubis12.jpg" alt="gexel" class="avatar-main" />
        <div class="glitch-layer glitch-cyan"></div>
        <div class="glitch-layer glitch-red"></div>
        <div class="glitch-layer glitch-slice"></div>
        <div class="glitch-scanlines"></div>
      </div>
    </div>

    <h1 class="alias" id="alias-name">gexel</h1>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badge-text">Encrypted // Node</span>
    </div>

    <div class="divider"></div>

    <div class="scramble-box">
      <p class="scramble-text" id="quote-line">Nothing to see here.</p>
      <span class="sub-code" id="hex-code">0x00_VOID // RESTRICTED</span>
    </div>

    <div class="node-id">[ SYSTEM OFFLINE ]</div>
  </main>

  <script>
    // ── 1. Interactive Neural Grid Canvas Background ──
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const particleCount = 45;
    let mouse = { x: null, y: null, maxDist: 120 };

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.5 + 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 242, 255, 0.45)';
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 242, 255, ${0.15 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // ── 2. Text Scramble / Decoder Effect ──
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________01';
        this.update = this.update.bind(this);
      }
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          const start = Math.floor(Math.random() * 20);
          const end = start + Math.floor(Math.random() * 20);
          this.queue.push({ from, to, start, end });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0, n = this.queue.length; i < n; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span style="color: #00f2ff; opacity: 0.8;">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }

    const phrases = [
      "Nothing to see here.",
      "Silence is a virtue.",
      "Just observing.",
      "Access restricted.",
      "Lost in the cyberspace.",
      "Presence without trace."
    ];

    const quoteEl = document.getElementById('quote-line');
    const scrambler = new TextScramble(quoteEl);
    let phraseIndex = 0;

    function nextPhrase() {
      phraseIndex = (phraseIndex + 1) % phrases.length;
      scrambler.setText(phrases[phraseIndex]);
    }

    // Interval to cycle subtle mysterious phrases
    setInterval(nextPhrase, 5000);

    // ── 3. Subtle Cyber Audio Synthetic Click on Interaction ──
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(950, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // Avatar interaction (easter egg scramble + intense glitch burst + beep)
    const avatarBtn = document.getElementById('avatar-btn');
    const hexEl = document.getElementById('hex-code');
    const hexCodes = [
      "0x00_VOID // RESTRICTED",
      "SIGNAL_LOCKED // 256-BIT",
      "ANONYMOUS_GATEWAY // OK",
      "STATUS: STEALTH_MODE"
    ];
    let hexIdx = 0;

    avatarBtn.addEventListener('click', (e) => {
      playBeep();
      nextPhrase();
      hexIdx = (hexIdx + 1) % hexCodes.length;
      hexEl.textContent = hexCodes[hexIdx];

      // Trigger intense glitch burst
      avatarBtn.classList.add('active-glitch');
      setTimeout(() => {
        avatarBtn.classList.remove('active-glitch');
      }, 600);

      // Ripple animation
      const card = document.getElementById('main-card');
      const rect = card.getBoundingClientRect();
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = '120px';
      ripple.style.left = (e.clientX - rect.left - 60) + 'px';
      ripple.style.top = (e.clientY - rect.top - 60) + 'px';
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  </script>
</body>
</html>
